[package]
name = "foundry"
version = "3.3.0"
edition = "2021"
description = "Autonomous build loop — the engine of Context Foundry"
license = "MIT"
repository = "https://github.com/context-foundry/context-foundry"
homepage = "https://contextfoundry.dev"

[lib]
name = "foundry"
path = "src/lib.rs"

[[bin]]
name = "foundry"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
ratatui = "0.30"
crossterm = { version = "0.28", features = ["event-stream"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
anyhow = "1"
futures = "0.3"
portable-pty = "0.8"
blake3 = "1"
uuid = { version = "1", features = ["v4"] }
dunce = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
walkdir = "2"
glob = "0.3"
rusqlite = { version = "0.31", features = ["bundled"] }
axum = "0.8"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "chrono", "migrate", "macros", "json"] }
ulid = "1"
subtle = "2"
async-trait = "0.1"

[dev-dependencies]
tempfile = "3"
serial_test = "3"
tower = { version = "0.5", features = ["util"] }

[profile.release]
opt-level = 3
lto = true
strip = true
