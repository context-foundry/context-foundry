[package]
name = "context-foundry-desktop"
version = "0.1.0"
description = "Context Foundry Desktop - Visual dashboard for the CF Daemon"
authors = ["Context Foundry"]
edition = "2021"
rust-version = "1.70"

[lib]
name = "context_foundry_desktop_lib"
crate-type = ["lib"]

[[bin]]
name = "context-foundry-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
dirs = "5"
log = "0.4"
env_logger = "0.11"
thiserror = "1"
once_cell = "1"

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.25"
objc = "0.2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
