name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: foundry
            friendly: linux
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: foundry
            friendly: mac-intel
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: foundry
            friendly: mac-apple-silicon
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: foundry.exe
            friendly: windows

    runs-on: ${{ matrix.os }}
    environment: release

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Import Apple certificates
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_INSTALLER_CERTIFICATE: ${{ secrets.APPLE_INSTALLER_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          APP_CERT=$RUNNER_TEMP/app-certificate.p12
          INST_CERT=$RUNNER_TEMP/installer-certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          echo "$APPLE_CERTIFICATE" | base64 --decode > "$APP_CERT"
          echo "$APPLE_INSTALLER_CERTIFICATE" | base64 --decode > "$INST_CERT"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$APP_CERT" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security import "$INST_CERT" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain

      - name: Sign macOS binary
        if: runner.os == 'macOS'
        run: |
          codesign --force --options runtime \
            --sign "Developer ID Application: FOZBE LLC (CP39A5FC6V)" \
            --timestamp \
            target/${{ matrix.target }}/release/${{ matrix.artifact }}

      - name: Build macOS .pkg installer
        if: runner.os == 'macOS'
        run: |
          mkdir -p pkg-root/usr/local/bin
          cp target/${{ matrix.target }}/release/${{ matrix.artifact }} pkg-root/usr/local/bin/
          pkgbuild \
            --root pkg-root \
            --identifier com.contextfoundry.foundry \
            --version ${{ github.ref_name }} \
            --install-location / \
            --sign "Developer ID Installer: FOZBE LLC (CP39A5FC6V)" \
            foundry-${{ matrix.friendly }}.pkg

      - name: Notarize macOS .pkg
        if: runner.os == 'macOS'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_NOTARIZE_PASSWORD: ${{ secrets.APPLE_NOTARIZE_PASSWORD }}
        run: |
          xcrun notarytool submit foundry-${{ matrix.friendly }}.pkg \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_NOTARIZE_PASSWORD" \
            --wait
          xcrun stapler staple foundry-${{ matrix.friendly }}.pkg

      - name: Azure login
        if: runner.os == 'Windows'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: e8cb6062-08d5-4de9-a2e6-82c9ecc37fdb

      - name: Sign Windows binary
        if: runner.os == 'Windows'
        uses: azure/trusted-signing-action@v0.5.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          endpoint: https://eus.codesigning.azure.net/
          trusted-signing-account-name: floweyessigning
          certificate-profile-name: floweyesrelease
          files-folder: target/${{ matrix.target }}/release
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../foundry-${{ matrix.friendly }}.tar.gz ${{ matrix.artifact }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          Compress-Archive -Path ${{ matrix.artifact }} -DestinationPath ../../../foundry-${{ matrix.friendly }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: foundry-${{ matrix.friendly }}
          path: |
            foundry-${{ matrix.friendly }}.*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            foundry-linux/foundry-linux.tar.gz
            foundry-mac-intel/foundry-mac-intel.tar.gz
            foundry-mac-intel/foundry-mac-intel.pkg
            foundry-mac-apple-silicon/foundry-mac-apple-silicon.tar.gz
            foundry-mac-apple-silicon/foundry-mac-apple-silicon.pkg
            foundry-windows/foundry-windows.zip
            install.sh
            install.ps1
          generate_release_notes: true
          body: |
            ## Install

            **macOS (recommended):** Download the `.pkg` installer
            **Linux:** Download the `.tar.gz` and extract to your PATH
            **Windows:** Download the `.zip`

            **Or use the install script:**
            ```sh
            curl -fsSL https://raw.githubusercontent.com/context-foundry/context-foundry/main/install.sh | sh
            ```

  publish-npm:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd npm && npm version "$VERSION" --no-git-tag-version

      - name: Publish to npm
        working-directory: npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
