name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest
            cross: false
          - target: x86_64-apple-darwin
            runner: macos-13
            cross: false
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            cross: false
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            cross: true

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build release binary
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Package binary
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../foundry-${{ matrix.target }}.tar.gz foundry
          cd ../../..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: foundry-${{ matrix.target }}
          path: foundry-${{ matrix.target }}.tar.gz

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release
          VERSION=${{ steps.version.outputs.VERSION }}

          for dir in artifacts/foundry-*/; do
            target=$(basename "$dir" | sed 's/^foundry-//')
            cp "$dir"/*.tar.gz "release/foundry-v${VERSION}-${target}.tar.gz"
          done

          cd release
          shasum -a 256 *.tar.gz > "foundry-v${VERSION}-checksums.txt"
          cat "foundry-v${VERSION}-checksums.txt"

      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          # Extract section between this version header and the next
          awk "/^## \[${VERSION}\]/{found=1; next} /^## \[/{if(found) exit} found" CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "Release v${VERSION}" > release_notes.md
          fi
          cat release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          files: release/*
          generate_release_notes: false

      - name: Update Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        if: env.TAP_TOKEN != ''
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          REPO="context-foundry/context-foundry"

          # Get SHA256s from checksums file
          CHECKSUMS=$(cat "release/foundry-v${VERSION}-checksums.txt")
          SHA_DARWIN_ARM=$(echo "$CHECKSUMS" | grep aarch64-apple-darwin | awk '{print $1}')
          SHA_DARWIN_X86=$(echo "$CHECKSUMS" | grep x86_64-apple-darwin | awk '{print $1}')
          SHA_LINUX_X86=$(echo "$CHECKSUMS" | grep x86_64-unknown-linux-gnu | awk '{print $1}')
          SHA_LINUX_ARM=$(echo "$CHECKSUMS" | grep aarch64-unknown-linux-gnu | awk '{print $1}')

          BASE_URL="https://github.com/${REPO}/releases/download/v${VERSION}"

          # Generate formula
          cat > foundry.rb << FORMULA
          class Foundry < Formula
            desc "Autonomous build loop — the engine of Context Foundry"
            homepage "https://github.com/${REPO}"
            version "${VERSION}"
            license "MIT"

            on_macos do
              if Hardware::CPU.arm?
                url "${BASE_URL}/foundry-v${VERSION}-aarch64-apple-darwin.tar.gz"
                sha256 "${SHA_DARWIN_ARM}"
              else
                url "${BASE_URL}/foundry-v${VERSION}-x86_64-apple-darwin.tar.gz"
                sha256 "${SHA_DARWIN_X86}"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url "${BASE_URL}/foundry-v${VERSION}-aarch64-unknown-linux-gnu.tar.gz"
                sha256 "${SHA_LINUX_ARM}"
              else
                url "${BASE_URL}/foundry-v${VERSION}-x86_64-unknown-linux-gnu.tar.gz"
                sha256 "${SHA_LINUX_X86}"
              end
            end

            def install
              bin.install "foundry"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/foundry --version")
            end
          end
          FORMULA

          # Push to tap repo
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/context-foundry/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp foundry.rb tap/Formula/foundry.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/foundry.rb
          git commit -m "Update foundry to v${VERSION}" || true
          git push
