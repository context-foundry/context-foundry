name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: foundry
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: foundry
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: foundry
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: foundry.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../foundry-${{ matrix.target }}.tar.gz ${{ matrix.artifact }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          Compress-Archive -Path ${{ matrix.artifact }} -DestinationPath ../../../foundry-${{ matrix.target }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: foundry-${{ matrix.target }}
          path: foundry-${{ matrix.target }}.*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            foundry-x86_64-unknown-linux-gnu/foundry-x86_64-unknown-linux-gnu.tar.gz
            foundry-x86_64-apple-darwin/foundry-x86_64-apple-darwin.tar.gz
            foundry-aarch64-apple-darwin/foundry-aarch64-apple-darwin.tar.gz
            foundry-x86_64-pc-windows-msvc/foundry-x86_64-pc-windows-msvc.zip
            install.sh
            install.ps1
          generate_release_notes: true
          body: |
            ## Install

            **Unix (macOS / Linux):**
            ```sh
            curl -fsSL https://raw.githubusercontent.com/context-foundry/context-foundry/main/install.sh | sh
            ```

            **Windows (PowerShell):**
            ```powershell
            irm https://raw.githubusercontent.com/context-foundry/context-foundry/main/install.ps1 | iex
            ```

            **npm:**
            ```sh
            npm install -g @context-foundry/foundry
            ```
