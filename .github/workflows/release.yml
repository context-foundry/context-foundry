name: Release

on:
  push:
    tags:
      - 'v*'  # Triggers on v2.5.0, v2.5.1, etc.

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      # Extract version from tag
      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      # Sync version to all files
      - name: Sync versions across all files
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          echo "Syncing version to $VERSION"

          # Update __version__.py (the master)
          sed -i "s/__version__ = \".*\"/__version__ = \"$VERSION\"/" __version__.py
          sed -i "s/__release_date__ = \".*\"/__release_date__ = \"$(date +%Y-%m-%d)\"/" __version__.py

          # Update npm/package.json
          cd npm && npm version $VERSION --no-git-tag-version --allow-same-version && cd ..

          # Update public/index.html version references
          sed -i "s/\?v=[0-9.]*/?v=$VERSION/g" public/index.html
          sed -i "s/Version [0-9.]*</Version $VERSION</g" public/index.html

          echo "Version sync complete"
          echo "=== __version__.py ==="
          grep __version__ __version__.py
          echo "=== npm/package.json ==="
          grep '"version"' npm/package.json
          echo "=== public/index.html footer ==="
          grep "Version" public/index.html

      # Build Python package
      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build Python package
        run: python -m build

      # Publish to PyPI
      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: twine upload dist/*

      # Publish to npm
      - name: Publish to npm
        working-directory: npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

      # Create GitHub Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            ## Installation

            ```bash
            # npm (recommended)
            npm install -g context-foundry

            # pip
            pip install context-foundry
            ```

            See [CHANGELOG](https://github.com/context-foundry/context-foundry/blob/main/CHANGELOG.md) for details.

      # Commit version sync changes back to main
      - name: Commit version sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "chore: sync version to ${{ steps.version.outputs.VERSION }} [skip ci]"
          git push origin HEAD:main || echo "No changes to push"
