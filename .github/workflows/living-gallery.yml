name: Living Gallery -- Generate Scene

on:
  schedule:
    - cron: '23 */2 * * *'  # Every 2 hours at :23
  workflow_dispatch:
    inputs:
      seed_id:
        description: 'Specific seed ID to use (optional)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: scripts/gallery
        run: npm ci

      - name: Generate scene
        working-directory: scripts/gallery
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "${{ inputs.seed_id }}" ]; then
            node generate-scene.js --seed-id "${{ inputs.seed_id }}"
          else
            node generate-scene.js
          fi

      - name: Commit and push
        run: |
          git config user.name "context-foundry[bot]"
          git config user.email "bot@contextfoundry.dev"
          git add docs/scenes/
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          SCENE_FILE=$(git diff --cached --name-only --diff-filter=AM | grep '^docs/scenes/.*\.js$' | head -1 || true)
          if [ -n "$SCENE_FILE" ]; then
            COMMIT_SUBJECT="gallery: Generate scene $(basename "$SCENE_FILE" .js)"
          else
            COMMIT_SUBJECT="gallery: Update living gallery metadata"
          fi
          git commit -m "$COMMIT_SUBJECT" -m "Automated by Living Gallery workflow." -m "Model: gpt-4o-mini"
          git pull --rebase
          git push
