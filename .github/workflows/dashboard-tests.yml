name: Dashboard E2E Tests

on:
  push:
    branches: [main, develop]
    paths:
      - 'tools/dashboard/**'
      - 'apps/context-foundry-desktop/**'
      - '.github/workflows/dashboard-tests.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'tools/dashboard/**'
      - 'apps/context-foundry-desktop/**'
      - '.github/workflows/dashboard-tests.yml'

jobs:
  test:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tools/dashboard/package-lock.json

      - name: Install dependencies
        working-directory: tools/dashboard
        run: npm ci

      - name: Install Playwright browsers
        working-directory: tools/dashboard
        run: npx playwright install --with-deps chromium

      - name: Run unit tests
        working-directory: tools/dashboard
        run: npm run test -- --run

      - name: Run E2E tests
        working-directory: tools/dashboard
        run: npm run test:e2e:chromium

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: tools/dashboard/playwright-report/
          retention-days: 30

      - name: Upload test screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-screenshots
          path: tools/dashboard/test-results/
          retention-days: 7

  screenshots:
    name: Generate Documentation Screenshots
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tools/dashboard/package-lock.json

      - name: Install dependencies
        working-directory: tools/dashboard
        run: npm ci

      - name: Install Playwright browsers
        working-directory: tools/dashboard
        run: npx playwright install --with-deps chromium

      - name: Generate screenshots
        working-directory: tools/dashboard
        run: npm run test:screenshots

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: documentation-screenshots
          path: docs/images/
          retention-days: 90

  build:
    name: Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tools/dashboard/package-lock.json

      - name: Install dependencies
        working-directory: tools/dashboard
        run: npm ci

      - name: Type check
        working-directory: tools/dashboard
        run: npx tsc --noEmit

      - name: Lint
        working-directory: tools/dashboard
        run: npm run lint || true  # Don't fail on lint warnings

      - name: Build
        working-directory: tools/dashboard
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-build
          path: tools/dashboard/dist/
          retention-days: 7
