name: Foundry PR Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest

    # Skip if PR has the skip-foundry-review label
    if: "!contains(github.event.pull_request.labels.*.name, 'skip-foundry-review')"

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Install foundry
        run: |
          set -e
          REPO="context-foundry/context-foundry"
          VERSION=$(curl -fsSL "https://api.github.com/repos/${REPO}/releases/latest" | grep '"tag_name"' | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$VERSION" ]; then
            echo "::error::Failed to determine latest foundry version"
            exit 1
          fi
          ARCHIVE="foundry-linux.tar.gz"
          URL="https://github.com/${REPO}/releases/download/${VERSION}/${ARCHIVE}"
          echo "Installing foundry ${VERSION}..."
          curl -fsSL "$URL" -o "/tmp/${ARCHIVE}"
          tar xzf "/tmp/${ARCHIVE}" -C /tmp
          chmod +x /tmp/foundry
          sudo mv /tmp/foundry /usr/local/bin/foundry
          foundry --version

      - name: Run foundry review
        id: review
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          foundry review-pr ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --output comment

      - name: Post failure comment
        if: steps.review.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --body "## Foundry Review Failed

          The automated foundry review encountered an error and could not complete.

          **Step outcome:** \`${{ steps.review.outcome }}\`

          This does not block the PR. Please review manually or re-trigger by pushing a new commit.

          ---
          *Automated by [foundry review-pr](https://github.com/context-foundry/context-foundry)*"
