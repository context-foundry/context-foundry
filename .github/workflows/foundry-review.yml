name: Foundry PR Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest

    # Skip if PR has the skip-foundry-review label
    if: "!contains(github.event.pull_request.labels.*.name, 'skip-foundry-review')"

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Install foundry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          gh release download --repo context-foundry/context-foundry --pattern 'foundry-linux.tar.gz' -D /tmp
          tar xzf /tmp/foundry-linux.tar.gz -C /tmp
          chmod +x /tmp/foundry
          sudo mv /tmp/foundry /usr/local/bin/foundry
          foundry --version

      - name: Run foundry review
        id: review
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          foundry review-pr "$PR_NUMBER" \
            --repo "$REPO" \
            --output comment \
            --ignore-project-config

      - name: Post failure comment
        if: steps.review.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          REVIEW_OUTCOME: ${{ steps.review.outcome }}
        run: |
          gh pr comment "$PR_NUMBER" \
            --repo "$REPO" \
            --body "## Foundry Review Failed

          The automated foundry review encountered an error and could not complete.

          **Step outcome:** \`${REVIEW_OUTCOME}\`

          This does not block the PR. Please review manually or re-trigger by pushing a new commit.

          ---
          *Automated by [foundry review-pr](https://github.com/context-foundry/context-foundry)*"
