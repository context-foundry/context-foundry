name: Issue
description: Report a bug or propose a change
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Be specific. What's broken, missing, or frustrating?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What's your proposed solution?
      description: How should this work instead?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Why not other approaches?
      description: What else did you consider and why didn't it work?
    validations:
      required: false

  - type: textarea
    id: proof
    attributes:
      label: How did you verify your fix?
      description: Screenshots, videos, or test output welcome.
    validations:
      required: false
