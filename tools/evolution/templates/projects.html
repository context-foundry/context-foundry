<!DOCTYPE html>
<html>
<head>
    <title>Projects - CFES</title>
    <style>body { font-family: system-ui; margin: 20px; }</style>
</head>
<body>
    <h1>Project Registry</h1>
    <table>
        <tr><th>Path</th><th>Type</th><th>Last Updated</th></tr>
        {% for project in projects %}
        <tr>
            <td>{{ project.path }}</td>
            <td>{{ project.project_type }}</td>
            <td>{{ project.last_updated }}</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
