<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Glass Pane Icon -->
  <rect x="15" y="15" width="70" height="70" rx="8" fill="url(#grad)" opacity="0.2"/>
  <rect x="15" y="15" width="70" height="70" rx="8" fill="none" stroke="url(#grad)" stroke-width="4"/>

  <!-- Grid Pattern -->
  <line x1="50" y1="15" x2="50" y2="85" stroke="url(#grad)" stroke-width="2" opacity="0.6"/>
  <line x1="15" y1="50" x2="85" y2="50" stroke="url(#grad)" stroke-width="2" opacity="0.6"/>

  <!-- Center Diamond -->
  <path d="M 50 35 L 60 50 L 50 65 L 40 50 Z" fill="url(#grad)"/>
</svg>
