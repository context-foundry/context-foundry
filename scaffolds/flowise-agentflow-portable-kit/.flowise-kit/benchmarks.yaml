benchmarks:
  - id: chaining-review
    file: example-flows/afv2-patterns/01-chaining.json
    prompt: Build an AgentFlow v2 that ingests a policy document, extracts obligations, validates them, pauses for human review, and returns a final approval report.
  - id: parallel-research
    file: example-flows/afv2-patterns/02-parallel.json
    prompt: Build an AgentFlow v2 that researches a vendor from web, internal knowledge, and risk analysis in parallel, then synthesizes one recommendation.
  - id: routing-helpdesk
    file: example-flows/afv2-patterns/03-routing.json
    prompt: Build an AgentFlow v2 that routes incoming requests to billing, technical, or general support specialists and returns one synthesized answer.
  - id: iteration-review
    file: example-flows/afv2-patterns/04-iteration.json
    prompt: Build an AgentFlow v2 that iterates over a list of requirements, evaluates each item, accumulates findings, and returns a summary.
  - id: software-dev-team
    file: example-flows/masterclass-2025/software-dev-team-agents.json
    prompt: Build a software development team flow with planner, developer, tester, and reviewer agents.
  - id: deep-research
    file: example-flows/masterclass-2025/deep-research-agentflow.json
    prompt: Build a deep research orchestrator with planning, search loops, evidence gathering, and synthesis.
  - id: succession-planning
    file: example-flows/succession-planning-orchestrator.json
    prompt: Build a Workday-style succession planning orchestrator with approval gates and structured recommendations.
