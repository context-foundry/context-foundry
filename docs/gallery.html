<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Living Gallery -- Context Foundry</title>
  <meta name="description" content="Auto-generated pixel art scenes -- a new one every 2 hours, powered by the build loop.">
  <meta property="og:title" content="Living Gallery -- Context Foundry">
  <meta property="og:description" content="Auto-generated pixel art scenes -- a new one every 2 hours, powered by the build loop.">
  <meta property="og:image" content="assets/og-card-1200x630.png">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://contextfoundry.dev/gallery.html">
  <link rel="icon" type="image/png" href="assets/favicon-square-512.png">
  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --text-muted: #8b949e;
      --accent: #f0a500;
      --accent-subtle: rgba(240, 165, 0, 0.15);
      --radius: 4px;
      --font-mono: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;
    }
    * { box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 0.9rem;
      line-height: 1.7;
      max-width: 1100px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
    }
    h1 {
      color: var(--accent);
      font-size: 1.5rem;
      border-bottom: 2px solid var(--accent);
      padding-bottom: 0.5rem;
      margin-bottom: 0.25rem;
    }
    h2 {
      color: var(--accent);
      font-size: 1.15rem;
      border-left: 3px solid var(--accent);
      padding-left: 0.75rem;
      margin-top: 2.5rem;
      margin-bottom: 0.75rem;
    }
    p { margin: 0.75rem 0; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .hook { font-size: 1.05rem; color: var(--text); margin-bottom: 0.25rem; }
    .subtitle { color: var(--text-muted); font-size: 0.85rem; margin-top: 0; }
    .muted { color: var(--text-muted); }
    footer {
      margin-top: 3rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 0.8rem;
    }
    .gh-corner { position: fixed; top: 1rem; right: 1.5rem; z-index: 10; }
    .gh-corner a { color: var(--text-muted); transition: color 0.15s; }
    .gh-corner a:hover { color: var(--accent); }

    /* Stats bar */
    .stats {
      display: flex;
      gap: 2rem;
      flex-wrap: wrap;
      margin: 1rem 0 1.5rem 0;
      font-size: 0.85rem;
    }
    .stats span { color: var(--text-muted); }
    .stats strong { color: var(--accent); }

    /* Biome filter bar */
    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin: 1rem 0 1.5rem 0;
    }
    .filter-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-size: 0.75rem;
      padding: 0.25rem 0.65rem;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
    }
    .filter-btn:hover {
      border-color: var(--accent);
      color: var(--text);
    }
    .filter-btn.active {
      background: var(--accent-subtle);
      border-color: var(--accent);
      color: var(--accent);
    }

    /* Card grid */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.25rem;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      transition: border-color 0.15s;
    }
    .card:hover { border-color: var(--accent); }
    .card canvas {
      display: block;
      width: 100%;
      height: auto;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      background: var(--bg);
    }
    .card-body {
      padding: 0.65rem 0.85rem 0.75rem 0.85rem;
    }
    .card-name {
      font-weight: bold;
      font-size: 0.85rem;
      margin: 0 0 0.15rem 0;
      color: var(--text);
    }
    .card-location {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin: 0 0 0.4rem 0;
      min-height: 1.2em;
    }
    .card-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.4rem;
    }
    .badge {
      display: inline-block;
      font-size: 0.65rem;
      padding: 0.1rem 0.45rem;
      border-radius: 9999px;
      background: var(--accent-subtle);
      color: var(--accent);
      border: 1px solid rgba(240, 165, 0, 0.3);
      white-space: nowrap;
    }
    .badge-model {
      background: rgba(139, 148, 158, 0.12);
      color: var(--text-muted);
      border-color: rgba(139, 148, 158, 0.25);
    }
    .card-date {
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-left: auto;
    }

    /* Loading state */
    .loading {
      text-align: center;
      padding: 4rem 0;
      color: var(--text-muted);
    }
    .error {
      text-align: center;
      padding: 4rem 0;
      color: #f04040;
    }

    @media (max-width: 600px) {
      body { padding: 1.5rem 1rem; }
      .card-grid { grid-template-columns: 1fr; }
      .gh-corner { position: static; text-align: right; margin-bottom: 1rem; }
      .stats { flex-direction: column; gap: 0.5rem; }
    }
    @media print {
      body { background: white; color: black; max-width: none; padding: 0.5in; }
      h1, h2 { color: #333; }
      footer { color: #666; }
      .card canvas { display: none; }
      .card { break-inside: avoid; }
      .filter-bar { display: none; }
      .gh-corner { display: none; }
    }
  </style>
</head>
<body>

<div class="gh-corner">
  <a href="https://github.com/context-foundry/context-foundry" title="View on GitHub">
    <svg width="28" height="28" viewBox="0 0 28 28" xmlns="http://www.w3.org/2000/svg">
      <path d="M14 1 C6.8 1 1 6.8 1 14 C1 19.7 4.7 24.5 9.8 26.2 C10.4 26.3 10.6 25.9 10.6 25.6 C10.6 25.3 10.6 24.4 10.6 23.3 C7.2 24.1 6.5 21.7 6.5 21.7 C5.9 20.2 5.1 19.8 5.1 19.8 C4 19 5.2 19 5.2 19 C6.4 19.1 7 20.3 7 20.3 C8.1 22.2 9.9 21.6 10.7 21.3 C10.8 20.5 11.1 19.9 11.5 19.6 C8.7 19.3 5.8 18.2 5.8 13.2 C5.8 11.8 6.3 10.7 7.1 9.8 C6.9 9.5 6.5 8.2 7.2 6.5 C7.2 6.5 8.2 6.2 10.6 7.8 C11.5 7.6 12.5 7.4 13.5 7.4 C14.5 7.4 15.5 7.6 16.4 7.8 C18.8 6.2 19.8 6.5 19.8 6.5 C20.5 8.2 20.1 9.5 19.9 9.8 C20.7 10.7 21.2 11.8 21.2 13.2 C21.2 18.2 18.3 19.3 15.5 19.6 C15.9 20 16.3 20.7 16.3 21.9 C16.3 23.5 16.3 24.8 16.3 25.5 C16.3 25.9 16.5 26.3 17.2 26.2 C22.3 24.5 26 19.7 26 14 C26 6.8 20.2 1 14 1 Z" fill="currentColor"/>
    </svg>
  </a>
</div>

<header>
  <p class="muted"><a href="index.html">contextfoundry.dev</a></p>
  <h1>Living Gallery</h1>
  <p class="hook">New pixel art scenes auto-generated every 2 hours. Each is a real-world location.</p>
  <div class="stats">
    <span id="scene-count">Loading...</span>
    <span id="next-gen"></span>
  </div>
</header>

<div id="filter-bar" class="filter-bar"></div>

<div id="gallery" class="card-grid">
  <div class="loading">Loading scenes...</div>
</div>

<footer>
  <a href="index.html">Context Foundry</a> &middot;
  <a href="https://github.com/context-foundry/context-foundry">GitHub</a> &middot;
  MIT License
</footer>

<script>
(function(){
  'use strict';

  // ---------------------------------------------------------------
  // Shared drawing API -- defined once, parameterized by context
  // ---------------------------------------------------------------
  function makeAPI(ctx, W, H) {
    function px(x,y,col){ctx.fillStyle=col;ctx.fillRect(Math.floor(x),Math.floor(y),1,1);}
    function rect(x,y,w,h,col){ctx.fillStyle=col;ctx.fillRect(Math.floor(x),Math.floor(y),Math.ceil(w),Math.ceil(h));}
    function hexRgb(h){var n=parseInt(h.slice(1),16);return[(n>>16)&255,(n>>8)&255,n&255];}
    function rgba(h,a){var rgb=hexRgb(h);return'rgba('+rgb[0]+','+rgb[1]+','+rgb[2]+','+a+')';}
    function lerp(a,b,t){var ar=hexRgb(a),br=hexRgb(b);return'rgb('+Math.round(ar[0]+(br[0]-ar[0])*t)+','+Math.round(ar[1]+(br[1]-ar[1])*t)+','+Math.round(ar[2]+(br[2]-ar[2])*t)+')';}
    function osc(t,p,ph){return(Math.sin((t/p)*Math.PI*2+(ph||0))+1)/2;}
    function srand(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
    function circle(cx,cy,r,col){for(var dy=-r;dy<=r;dy++)for(var dx=-r;dx<=r;dx++)if(dx*dx+dy*dy<=r*r)px(cx+dx,cy+dy,col);}
    return {px:px,rect:rect,hexRgb:hexRgb,rgba:rgba,lerp:lerp,osc:osc,srand:srand,circle:circle,ctx:ctx,W:W,H:H};
  }

  // ---------------------------------------------------------------
  // Scene registry -- keyed by scene name
  // ---------------------------------------------------------------
  var sceneFactories = {};

  // ---------------------------------------------------------------
  // Date formatting
  // ---------------------------------------------------------------
  var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  function formatDate(iso) {
    if (!iso) return null;
    var d = new Date(iso);
    if (isNaN(d.getTime())) return iso;
    return MONTHS[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear();
  }

  // ---------------------------------------------------------------
  // Cron "next generation" estimate from "23 */2 * * *"
  // ---------------------------------------------------------------
  function nextGenMinutes(cronStr) {
    if (!cronStr) return null;
    var parts = cronStr.split(/\s+/);
    if (parts.length < 5) return null;
    var minute = parseInt(parts[0], 10);
    if (isNaN(minute)) return null;
    // Parse hour pattern: */2 means every 2 hours
    var hourInterval = 2;
    if (parts[1].indexOf('/') !== -1) {
      hourInterval = parseInt(parts[1].split('/')[1], 10) || 2;
    }
    var now = new Date();
    var nowH = now.getHours();
    var nowM = now.getMinutes();
    // Find the next run hour
    for (var ahead = 0; ahead <= 24; ahead++) {
      var candidateH = (nowH + ahead) % 24;
      if (candidateH % hourInterval === 0) {
        var diff;
        if (ahead === 0) {
          diff = minute - nowM;
          if (diff > 0) return diff;
          // else this slot already passed, continue
        } else {
          diff = ahead * 60 + (minute - nowM);
          if (diff > 0) return diff;
        }
      }
    }
    return null;
  }

  // ---------------------------------------------------------------
  // Sorting: newest first, null-generated (founding) scenes last
  // ---------------------------------------------------------------
  function sortScenes(scenes) {
    return scenes.slice().sort(function(a, b) {
      if (a.generated === null && b.generated === null) return 0;
      if (a.generated === null) return 1;
      if (b.generated === null) return -1;
      return new Date(b.generated).getTime() - new Date(a.generated).getTime();
    });
  }

  // ---------------------------------------------------------------
  // Build a card DOM element
  // ---------------------------------------------------------------
  function buildCard(entry) {
    var card = document.createElement('div');
    card.className = 'card';
    card.dataset.biome = entry.biome || '';

    var canvas = document.createElement('canvas');
    canvas.width = 480;
    canvas.height = 260;
    card.appendChild(canvas);

    var body = document.createElement('div');
    body.className = 'card-body';

    var nameEl = document.createElement('div');
    nameEl.className = 'card-name';
    nameEl.textContent = entry.name;
    body.appendChild(nameEl);

    var locEl = document.createElement('div');
    locEl.className = 'card-location';
    locEl.textContent = entry.location || '';
    body.appendChild(locEl);

    var meta = document.createElement('div');
    meta.className = 'card-meta';

    if (entry.biome) {
      var badge = document.createElement('span');
      badge.className = 'badge';
      badge.textContent = entry.biome;
      meta.appendChild(badge);
    }

    if (entry.model && entry.model !== 'human') {
      var modelBadge = document.createElement('span');
      modelBadge.className = 'badge badge-model';
      modelBadge.textContent = entry.model;
      meta.appendChild(modelBadge);
    }

    var dateStr = formatDate(entry.generated);
    if (dateStr) {
      var dateEl = document.createElement('span');
      dateEl.className = 'card-date';
      dateEl.textContent = dateStr;
      meta.appendChild(dateEl);
    }

    body.appendChild(meta);
    card.appendChild(body);

    return { el: card, canvas: canvas, entry: entry, drawFn: null, frame: 0, running: false, initialized: false };
  }

  // ---------------------------------------------------------------
  // IntersectionObserver -- start/stop animation per card
  // ---------------------------------------------------------------
  var activeCards = new Map(); // canvas -> cardObj

  var observer = new IntersectionObserver(function(entries) {
    entries.forEach(function(ioEntry) {
      var cardObj = activeCards.get(ioEntry.target);
      if (!cardObj) return;
      if (ioEntry.isIntersecting) {
        if (!cardObj.running) {
          cardObj.running = true;
          animateCard(cardObj);
        }
      } else {
        cardObj.running = false;
      }
    });
  }, { rootMargin: '100px' });

  function animateCard(cardObj) {
    if (!cardObj.running) return;
    if (!cardObj.initialized) {
      // Try to initialize the scene draw function
      var factory = sceneFactories[cardObj.entry.name];
      if (!factory) { cardObj.running = false; return; }
      var ctx = cardObj.canvas.getContext('2d');
      ctx.imageSmoothingEnabled = false;
      var api = makeAPI(ctx, cardObj.canvas.width, cardObj.canvas.height);
      try {
        cardObj.drawFn = factory(api);
      } catch(e) {
        console.warn('Scene init failed:', cardObj.entry.name, e);
        cardObj.running = false;
        return;
      }
      cardObj.initialized = true;
    }
    if (!cardObj.drawFn) { cardObj.running = false; return; }
    try {
      cardObj.drawFn(cardObj.frame / 15);
    } catch(e) {
      console.warn('Scene draw failed:', cardObj.entry.name, e);
      cardObj.running = false;
      return;
    }
    cardObj.frame++;
    setTimeout(function(){ animateCard(cardObj); }, 1000 / 15);
  }

  // ---------------------------------------------------------------
  // Biome filter logic
  // ---------------------------------------------------------------
  var allCardObjs = [];
  var currentBiome = 'all';

  function applyFilter(biome) {
    currentBiome = biome;
    // Update button states
    var btns = document.querySelectorAll('.filter-btn');
    btns.forEach(function(btn) {
      btn.classList.toggle('active', btn.dataset.biome === biome);
    });
    // Show/hide cards
    allCardObjs.forEach(function(cardObj) {
      var show = (biome === 'all' || cardObj.entry.biome === biome);
      cardObj.el.style.display = show ? '' : 'none';
      if (!show && cardObj.running) {
        cardObj.running = false;
      }
    });
  }

  function buildFilterBar(scenes) {
    var biomes = {};
    scenes.forEach(function(s) { if (s.biome) biomes[s.biome] = true; });
    var bar = document.getElementById('filter-bar');

    var allBtn = document.createElement('button');
    allBtn.className = 'filter-btn active';
    allBtn.textContent = 'All';
    allBtn.dataset.biome = 'all';
    allBtn.addEventListener('click', function(){ applyFilter('all'); });
    bar.appendChild(allBtn);

    Object.keys(biomes).sort().forEach(function(biome) {
      var btn = document.createElement('button');
      btn.className = 'filter-btn';
      btn.textContent = biome;
      btn.dataset.biome = biome;
      btn.addEventListener('click', function(){ applyFilter(biome); });
      bar.appendChild(btn);
    });
  }

  // ---------------------------------------------------------------
  // Load scenes from manifest and build the gallery
  // ---------------------------------------------------------------
  fetch('scenes/manifest.json')
    .then(function(r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(function(manifest) {
      var scenes = manifest.scenes || [];
      var sorted = sortScenes(scenes);

      // Stats
      document.getElementById('scene-count').innerHTML =
        '<strong>' + scenes.length + '</strong> scenes and counting';

      var mins = nextGenMinutes(manifest.cron);
      var nextEl = document.getElementById('next-gen');
      if (mins !== null) {
        nextEl.innerHTML = 'Next generation in ~<strong>' + mins + 'm</strong>';
      }

      // Filter bar
      buildFilterBar(sorted);

      // Temporarily redirect window.CF.register so scene scripts register into our map
      var origCF = window.CF;
      window.CF = { scenes: [], register: function(name, loc, factory) {
        sceneFactories[name] = factory;
        // Also push to scenes array for compatibility with scripts that expect it
        this.scenes.push({name: name, loc: loc, factory: factory});
      }};

      // Load all scene scripts, then build cards
      var total = sorted.length;
      var loaded = 0;

      function onScriptDone() {
        loaded++;
        if (loaded < total) return;

        // All scripts loaded -- build the card grid
        var gallery = document.getElementById('gallery');
        gallery.innerHTML = '';

        sorted.forEach(function(entry) {
          var cardObj = buildCard(entry);
          allCardObjs.push(cardObj);
          gallery.appendChild(cardObj.el);
          activeCards.set(cardObj.canvas, cardObj);
          observer.observe(cardObj.canvas);
        });

        // Restore original CF if anything needs it
        if (origCF) window.CF = origCF;
      }

      if (total === 0) {
        document.getElementById('gallery').innerHTML =
          '<div class="loading">No scenes found in manifest.</div>';
        return;
      }

      sorted.forEach(function(entry) {
        var s = document.createElement('script');
        s.src = 'scenes/' + entry.file;
        s.onload = onScriptDone;
        s.onerror = onScriptDone;
        document.head.appendChild(s);
      });
    })
    .catch(function(err) {
      console.error('Failed to load manifest:', err);
      document.getElementById('gallery').innerHTML =
        '<div class="error">Failed to load scenes. Check that scenes/manifest.json exists.</div>';
    });

})();
</script>

</body>
</html>
